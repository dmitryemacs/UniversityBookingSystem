# Docker Compose for Railway-like environment (external database)
# Use this to test with a separate PostgreSQL instance
# This mimics Railway's architecture where DB is a separate service

services:
  app:
    build:
      context: .
    container_name: booking_app_railway
    environment:
      # Railway provides these variables automatically
      DATABASE_URL: jdbc:postgresql://db:5432/booking
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/booking
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: mySecretKeyForJWTTokenGenerationMustBeLongEnough
      FRONTEND_URL: http://localhost:5173
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - booking_network

  # Optional: Database for local testing
  # Comment this out when testing with external DB
  db:
    image: postgres:15-alpine
    container_name: booking_db_railway
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_railway:/var/lib/postgresql/data
    networks:
      - booking_network

volumes:
  postgres_data_railway:

networks:
  booking_network:
    driver: bridge
